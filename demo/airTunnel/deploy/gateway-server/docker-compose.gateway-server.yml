version: "3.8"

services:
  air-gateway:
    image: air/gateway:10.0.0
    container_name: air-gateway
    restart: unless-stopped
    env_file:
      - ./secrets/airtunnel.env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      TZ: Asia/Shanghai
    ports:
      - "18080:8080"
      - "18443:18443"
    volumes:
      - ./config:/app/config:ro
      - ./plugins:/app/plugins:ro
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - fcj

networks:
  fcj:
    external: true
